<div [class.has-value]="hasValue()" [class.has-icon]="hasIcon()" [class.has-buttons]="hasButtons()">
  @if (hasIcon()) {
    <composa-icon class="icon" [name]="icon()" size="small" aria-hidden="true"></composa-icon>
  }

  <input
    #input
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [value]="renderedValue"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (keydown.enter)="onEnter($event)"
  />

  @if (actions().length > 0) {
    <span class="actions">
      @for (action of actions(); track action.icon) {
        <composa-button
          variant="flat"
          [icon]="action.icon"
          [disabled]="disabled() || action.disabled === true"
          [attr.title]="action.tooltip ?? null"
          [attr.aria-label]="getActionAriaLabel(action)"
          (clicked)="onActionClick(action, $event)"
        />
      }
    </span>
  }
</div>
